name: 🚀 Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ═════════════════════════════════════════════════════════════════════
  # JOB 1: PREPARE — Xác định Slug và Version tiếp theo
  # ═════════════════════════════════════════════════════════════════════
  prepare:
    name: 🔍 Prepare Metadata & Version
    runs-on: ubuntu-24.04
    outputs:
      app_slug: ${{ steps.metadata.outputs.app_slug }}
      release_version: ${{ steps.versioning.outputs.release_version }}
      version_num: ${{ steps.versioning.outputs.version_num }}
      build_num: ${{ steps.versioning.outputs.build_num }}
      flutter_version: ${{ steps.versioning.outputs.flutter_version }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. Tạo Slug từ tên Repository ──────────────────────────────
      - name: 🏷️ Generate App Slug
        id: metadata
        run: |
          RAW_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="${GITHUB_REPOSITORY#*/}"
          fi
          # Convert to lowercase, replace spaces/underscores with dashes, remove invalid characters
          SLUG=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]')
          SLUG=$(echo "$SLUG" | sed -E 's/[ _]+/-/g' | sed -E 's/[^a-z0-9-]+//g')
          SLUG=$(echo "$SLUG" | sed -E 's/-+/-/g')
          SLUG=$(echo "$SLUG" | sed -E 's/^-+//; s/-+$//')
          if [ -z "$SLUG" ]; then
            SLUG="drugs-maker"
          fi
          echo "Computed Slug: $SLUG"
          echo "app_slug=${SLUG}" >> "$GITHUB_OUTPUT"

      # ── 2. Lấy Release mới nhất và tự động tăng Version ────────────
      - name: 🔢 Calculate Next Release Version
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=""
          if command -v gh >/dev/null 2>&1; then
            LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          fi

          echo "Latest GitHub Release Tag: '$LATEST_TAG'"

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            # Chưa có release nào -> bắt đầu từ v1.0
            RELEASE_VER="v1.0"
            MAJOR=1
            MINOR=0
            PATCH=0
            BUILD_NUM=1
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH REST <<< "${CLEAN_TAG}.0.0"
            if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then MAJOR=1; fi
            if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then MINOR=0; fi
            
            # Tăng minor version (v1.0 -> v1.1 -> v1.2 ...)
            MINOR=$((MINOR + 1))
            RELEASE_VER="v${MAJOR}.${MINOR}"
            PATCH=0
            BUILD_NUM=$((MINOR + 1))
          fi

          VER_NUM="${MAJOR}.${MINOR}.${PATCH}"
          FLUTTER_VER="${VER_NUM}+${BUILD_NUM}"

          echo "🚀 Next Release Version: ${RELEASE_VER}"
          echo "📦 Flutter Version: ${FLUTTER_VER}"

          echo "release_version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "version_num=${VER_NUM}" >> "$GITHUB_OUTPUT"
          echo "build_num=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "flutter_version=${FLUTTER_VER}" >> "$GITHUB_OUTPUT"

  # ═════════════════════════════════════════════════════════════════════
  # JOB 2: BUILD WINDOWS — Flutter Windows Desktop + Inno Setup (.exe)
  # ═════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Build Windows Installer (.exe)
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩺 Check Flutter Version
        run: flutter --version

      - name: 📝 Update pubspec.yaml Version
        shell: bash
        run: |
          sed -i -E "s|^(version:[[:space:]]*).*|\1${{ needs.prepare.outputs.flutter_version }}|" pubspec.yaml
          echo "Updated pubspec.yaml to version: ${{ needs.prepare.outputs.flutter_version }}"

      - name: 📦 Flutter Pub Get
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: 🔨 Build Flutter Windows Release
        run: flutter build windows --release

      - name: 📦 Compile Inno Setup Installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "ISCC.exe"
          }
          & $iscc `
            "/DAppVersion=${{ needs.prepare.outputs.version_num }}" `
            "/DAppSlug=${{ needs.prepare.outputs.app_slug }}" `
            "/DReleaseVersion=${{ needs.prepare.outputs.release_version }}" `
            installer.iss

      - name: ⬆️ Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3

  # ═════════════════════════════════════════════════════════════════════
  # JOB 3: BUILD LINUX — Flutter Linux Desktop + Debian Package (.deb)
  # ═════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Build Linux Package (.deb)
    needs: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Linux Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩺 Check Flutter Version
        run: flutter --version

      - name: 📝 Update pubspec.yaml Version
        run: |
          sed -i -E "s|^(version:[[:space:]]*).*|\1${{ needs.prepare.outputs.flutter_version }}|" pubspec.yaml
          echo "Updated pubspec.yaml to version: ${{ needs.prepare.outputs.flutter_version }}"

      - name: 📦 Flutter Pub Get
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: 🔨 Build Flutter Linux Release
        run: flutter build linux --release

      - name: 📦 Package Debian .deb
        env:
          APP_SLUG: ${{ needs.prepare.outputs.app_slug }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          APP_VERSION: ${{ needs.prepare.outputs.version_num }}
          SKIP_BUILD: "true"
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: ⬆️ Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 3

  # ═════════════════════════════════════════════════════════════════════
  # JOB 4: RELEASE — Xuất bản GitHub Release và đính kèm Artifacts
  # ═════════════════════════════════════════════════════════════════════
  release:
    name: 📢 Publish GitHub Release
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-24.04

    steps:
      - name: ⬇️ Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: ⬇️ Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: ./dist

      - name: 📋 List Release Artifacts
        run: |
          echo "Artifacts to be attached to Release:"
          ls -la ./dist/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          name: "💊 Drugs Maker ${{ needs.prepare.outputs.release_version }}"
          body: |
            ## 💊 Drugs Maker Release ${{ needs.prepare.outputs.release_version }}

            Ứng dụng Quản lý hóa đơn thuốc cao cấp với giao diện Glassmorphism (Flutter Desktop).

            ### 📥 Tải xuống / Downloads

            | Hệ điều hành | Tập tin cài đặt | Ghi chú |
            |---|---|---|
            | 🪟 **Windows 10/11** (64-bit) | `${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-windows-x64-setup.exe` | Trình cài đặt Wizard tiêu chuẩn (Inno Setup) |
            | 🐧 **Linux** Ubuntu/Debian (amd64) | `${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-linux-amd64.deb` | Gói cài đặt Debian (`sudo apt install ./...`) |

            ---

            ### 🪟 Hướng dẫn cài đặt Windows
            1. Tải về file `${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-windows-x64-setup.exe`.
            2. Chạy tệp tin và thực hiện: **Next** → **Next** → **Install** → **Finish**.
            3. Ứng dụng sẽ được cài vào thư mục Program Files và tạo biểu tượng trên Desktop & Start Menu.

            ### 🐧 Hướng dẫn cài đặt Linux
            ```bash
            # Cài đặt qua apt (tự động giải quyết dependencies):
            sudo apt install ./${{ needs.prepare.outputs.app_slug }}-${{ needs.prepare.outputs.release_version }}-linux-amd64.deb

            # Khởi chạy ứng dụng:
            drugs-maker
            ```
          draft: false
          prerelease: false
          files: |
            ./dist/**/*.exe
            ./dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

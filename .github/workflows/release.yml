name: 🚀 Build & Release

# ─────────────────────────────────────────────────────────────────────
# Trigger: khi có tag "v*" được push lên (do auto-version.yml tạo)
# Mục đích:
#   Job 1 (windows-latest) → build Flutter Windows → NSIS → .exe
#   Job 2 (ubuntu-latest)  → build Flutter Linux   → dpkg → .deb
#   Job 3 (ubuntu-latest)  → tổng hợp 2 artifact → tạo GitHub Release
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# ═════════════════════════════════════════════════════════════════════
# JOB 1 — 🪟 Windows: Flutter build + NSIS installer (.exe)
# ═════════════════════════════════════════════════════════════════════
jobs:
  build-windows:
    name: 🪟 Windows Installer (.exe)
    runs-on: windows-latest

    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Flutter pub get
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: 🔨 Build Windows release
        # Output: build\windows\x64\runner\Release\
        run: flutter build windows --release

      - name: 🏷️ Extract version (strip leading "v")
        id: ver
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      # Ghi version.nsh để NSIS đọc
      - name: 📝 Generate version.nsh
        shell: bash
        run: |
          echo '!define VERSION "${{ steps.ver.outputs.version }}"' > version.nsh

      # Cài NSIS — negrutiu fork hỗ trợ native amd64
      - name: 🏗️ Install NSIS
        uses: negrutiu/nsis-install@v2

      # Compile installer với makensis
      - name: 📦 Compile NSIS installer
        shell: cmd
        run: makensis installer.nsi

      - name: ⬆️ Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: drugs-maker-flutter-${{ steps.ver.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 3

  # ═════════════════════════════════════════════════════════════════════
  # JOB 2 — 🐧 Linux: Flutter build + dpkg (.deb)
  # ═════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Linux Package (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: 📦 Flutter pub get
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: 🔨 Build Linux release
        # Output: build/linux/x64/release/bundle/
        run: flutter build linux --release

      - name: 🏷️ Extract version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: 📦 Build .deb package
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: ⬆️ Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: drugs-maker-flutter_${{ steps.ver.outputs.version }}.0_amd64.deb
          if-no-files-found: error
          retention-days: 3

  # ═════════════════════════════════════════════════════════════════════
  # JOB 3 — 📢 Tạo GitHub Release với cả 2 file
  # ═════════════════════════════════════════════════════════════════════
  release:
    name: 📢 Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: 🏷️ Extract version
        id: ver
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./dist

      - name: ⬇️ Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: ./dist

      - name: 📋 List artifacts
        run: ls -lh ./dist/

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: "💊 Drugs Maker v${{ steps.ver.outputs.version }}"
          body: |
            ## 💊 Drugs Maker v${{ steps.ver.outputs.version }}

            ### 📥 Tải xuống / Download

            | Hệ điều hành | File | Ghi chú |
            |---|---|---|
            | 🪟 **Windows 10/11** (64-bit) | `drugs-maker-flutter-${{ steps.ver.outputs.version }}-setup.exe` | Cài Next→Next→Finish vào `C:\Program Files\Drugs Maker` |
            | 🐧 **Linux** Debian/Ubuntu (amd64) | `drugs-maker-flutter_${{ steps.ver.outputs.version }}.0_amd64.deb` | Cài qua GNOME Software / dpkg |

            ---

            ### 🪟 Hướng dẫn cài đặt Windows
            1. Tải file `.exe`
            2. Chạy → **Next** → **Next** → **Install** → **Finish**
            3. Ứng dụng tự cài vào `C:\Program Files\Drugs Maker\`
            4. Shortcut Desktop và Start Menu được tạo tự động

            ### 🐧 Hướng dẫn cài đặt Linux
            ```bash
            # Dùng apt (tự giải quyết dependencies — khuyến nghị)
            sudo apt install ./drugs-maker-flutter_${{ steps.ver.outputs.version }}.0_amd64.deb

            # Hoặc dpkg trực tiếp
            sudo dpkg -i drugs-maker-flutter_${{ steps.ver.outputs.version }}.0_amd64.deb

            # Chạy ứng dụng từ terminal
            drugs-maker-flutter
            ```

            ---
            **Copyright © Nguyễn Duy Trường 2026**
          draft: false
          prerelease: false
          files: |
            ./dist/drugs-maker-flutter-${{ steps.ver.outputs.version }}-setup.exe
            ./dist/drugs-maker-flutter_${{ steps.ver.outputs.version }}.0_amd64.deb
